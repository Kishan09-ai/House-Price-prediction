<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Prediction Result | AI House Value Predictor
    </title>


    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

            color: #ffffff;
        }


        .container {

            width: 100%;

            max-width: 850px;

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.4);

            text-align: center;
        }


        .title {

            font-size: 34px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #d4e5ea;

            margin-bottom: 30px;

            font-size: 15px;
        }


        .prediction-card {

            background:
                rgba(0, 0, 0, 0.2);

            border-radius: 15px;

            padding: 30px;

            margin-bottom: 30px;
        }


        .prediction-label {

            color: #c9dce2;

            font-size: 16px;

            margin-bottom: 12px;
        }


        .prediction-value {

            font-size: 45px;

            font-weight: bold;

            color: #00c6ff;

            word-break: break-word;
        }


        .input-section {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }


        .input-card {

            background:
                rgba(255, 255, 255, 0.08);

            border-radius: 12px;

            padding: 20px;
        }


        .input-card .label {

            display: block;

            color: #b9ced5;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .input-card .value {

            display: block;

            font-size: 20px;

            font-weight: bold;
        }


        .button-group {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .btn {

            display: inline-block;

            text-decoration: none;

            padding: 13px 25px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.3s;
        }


        .primary-btn {

            background: #00c6ff;

            color: white;
        }


        .secondary-btn {

            background:
                rgba(255, 255, 255, 0.12);

            color: white;

            border:
                1px solid
                rgba(255, 255, 255, 0.2);
        }


        .btn:hover {

            transform: translateY(-2px);
        }


        .footer {

            margin-top: 30px;

            color: #aebfc5;

            font-size: 13px;
        }


        @media (max-width: 700px) {

            .input-section {

                grid-template-columns: 1fr;
            }


            .container {

                padding: 25px;
            }


            .title {

                font-size: 28px;
            }


            .prediction-value {

                font-size: 35px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1 class="title">

        🏠 Prediction Result

    </h1>


    <p class="subtitle">

        Your AI-powered house value prediction

    </p>


    <div class="prediction-card">


        <div class="prediction-label">

            Estimated House Value

        </div>


        <div class="prediction-value">

            $<span id="prediction">
                Loading...
            </span>

        </div>


    </div>


    <div class="input-section">


        <div class="input-card">

            <span class="label">

                Average Rooms (RM)

            </span>


            <span
                class="value"
                id="rm"
            >

                -

            </span>

        </div>


        <div class="input-card">

            <span class="label">

                Property Tax (PT)

            </span>


            <span
                class="value"
                id="pt"
            >

                -

            </span>

        </div>


        <div class="input-card">

            <span class="label">

                Lower Status (LSTAT)

            </span>


            <span
                class="value"
                id="lstat"
            >

                -

            </span>

        </div>


    </div>


    <div class="button-group">


        <a
            href="index.html"
            class="btn primary-btn"
        >

            🔄 New Prediction

        </a>


        <a
            href="index.html"
            class="btn secondary-btn"
        >

            ← Back to Home

        </a>


    </div>


    <div class="footer">

        AI House Value Predictor | Kishan Singh

    </div>


</div>


<script>


const prediction =
    localStorage.getItem("prediction");


const rm =
    localStorage.getItem("rm");


const pt =
    localStorage.getItem("pt");


const lstat =
    localStorage.getItem("lstat");



if (prediction !== null) {

    const numericPrediction =
        Number(prediction);


    if (!isNaN(numericPrediction)) {

        document
            .getElementById("prediction")
            .textContent =
            numericPrediction.toFixed(2);

    }

    else {

        document
            .getElementById("prediction")
            .textContent =
            prediction;

    }

}

else {

    document
        .getElementById("prediction")
        .textContent =
        "N/A";

}



document
    .getElementById("rm")
    .textContent =
    rm || "N/A";


document
    .getElementById("pt")
    .textContent =
    pt || "N/A";


document
    .getElementById("lstat")
    .textContent =
    lstat || "N/A";


</script>


</body>

</html>
